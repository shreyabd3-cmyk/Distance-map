<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distance from Olympia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    :root { color-scheme: light; --cream: #fdf7e9; --ink: #3e4746;
      --purple: #54577c; --lavender: #9998cd; --teal: #4e988e; }
    body { background: transparent; font-family: Manrope, sans-serif; color: var(--ink);
      -webkit-font-smoothing: antialiased; }
    .widget { height: 100%; display: flex; flex-direction: column; overflow: hidden;
      background: var(--cream); border-radius: 24px; }
    .map-panel { position: relative; flex: 1 1 80%; min-height: 140px; background: #f5f3ed;
      margin: 10px 10px 0; border-radius: 14px; overflow: hidden; }
    #map { position: absolute; inset: 0; }
    .caption { flex: 0 0 20%; min-height: min-content; padding: 20px 28px;
      background: var(--cream); border-top: 1px solid #54577c1a;
      display: flex; align-items: center; justify-content: center; text-align: center; }
    .caption p { margin: 0; font-size: 1rem; line-height: 1.65; max-width: 57ch;
      font-weight: 400; text-wrap: pretty; }
    #distance { color: var(--purple); font-weight: 700; font-style: italic;
      text-decoration: underline; text-decoration-color: #9998cd66;
      text-decoration-thickness: 3px; text-underline-offset: 4px; }
    .marker { pointer-events: none; }
    .person { width: 60px; height: 64px; }
    .person-glyph { display: block; width: 60px; height: 64px; font-size: 60px;
      line-height: 64px; text-align: center; opacity: 0; transition: opacity 1100ms ease;
      filter: drop-shadow(0 2px 2px #fdf7e9) drop-shadow(0 2px 4px #3e474622); }
    .person-glyph.visible { opacity: 1; }
    .pin { width: 40px; height: 40px; filter: drop-shadow(0 2px 2px #fdf7e9) drop-shadow(0 2px 4px #3e474622); }
    .pin svg { display: block; }
    .status { position: absolute; inset: 0; display: grid; place-items: center;
      padding: 24px; text-align: center; color: var(--ink); background: #f5f3ed; z-index: 2;
      font-size: 0.9375rem; line-height: 1.6; }
    .status[hidden] { display: none; }
    /* Keep Mapbox's default logo and accessible attribution controls visible. */
    .mapboxgl-ctrl-attrib { font-family: Manrope, sans-serif; }
    @media (max-width: 420px) { .caption { padding: 20px; } }
    @media (prefers-reduced-motion: reduce) { .person-glyph { transition: none; } }
    /* In exceptionally short embeds, preserve access to the caption. */
    @media (max-height: 260px) { .widget { overflow-y: auto; } }
  </style>
</head>
<body>
  <main class="widget">
    <section class="map-panel" aria-label="Map showing Olympia and your approximate location">
      <div id="map"></div>
      <div class="status" id="status" role="status">Finding your approximate location…</div>
    </section>
    <section class="caption" aria-live="polite" aria-atomic="true">
      <p id="caption">I live in Olympia, Washington.</p>
    </section>
  </main>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
  <script>
  'use strict';
  // Paste your own public pk. token here. Never paste a secret sk. token.
  const MAPBOX_TOKEN = 'pk.eyJ1Ijoic2hyZXlhYmQiLCJhIjoiY21pejVidnVuMG10bDNrcHk1Z3k5aHRzcSJ9.qduOTQCG_kaOQWKYZgdGug';
  const OLYMPIA = [-122.8954, 47.0452]; // [longitude, latitude]
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const statusEl = document.getElementById('status');
  const captionEl = document.getElementById('caption');
  const mapPanel = document.querySelector('.map-panel');

  function milesBetween(a, b) {
    const rad = value => value * Math.PI / 180;
    const dLat = rad(b[1] - a[1]), dLng = rad(b[0] - a[0]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLng / 2) ** 2;
    return 3958.7613 * 2 * Math.asin(Math.sqrt(Math.min(1, Math.max(0, h))));
  }

  function validCoordinates(lng, lat) {
    return typeof lng === 'number' && typeof lat === 'number' &&
      Number.isFinite(lng) && Number.isFinite(lat) &&
      lng >= -180 && lng <= 180 && lat >= -90 && lat <= 90;
  }

  async function getVisitorLocation() {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    try {
      // Retain the endpoint that worked on the existing GitHub Pages widget.
      // No browser GPS permission, persistent location storage, or IP logging.
      const response = await fetch('https://geolocation-db.com/json/', {
        signal: controller.signal, credentials: 'omit', cache: 'no-store'
      });
      if (!response.ok) throw new Error('Location service unavailable');
      const data = await response.json();
      if (data.longitude === null || data.latitude === null ||
          data.longitude === '' || data.latitude === '') return null;
      const lng = Number(data.longitude), lat = Number(data.latitude);
      return validCoordinates(lng, lat) ? [lng, lat] : null;
    } catch {
      return null;
    } finally {
      clearTimeout(timeout);
    }
  }

  // Use a continuous longitude sequence so routes crossing the date line
  // take the short path instead of making the camera fit almost the whole world.
  function unwrapRoute(feature) {
    const segments = feature.geometry.type === 'MultiLineString'
      ? feature.geometry.coordinates : [feature.geometry.coordinates];
    const points = [];
    for (const segment of segments) {
      for (const coordinate of segment) {
        let lng = coordinate[0];
        if (points.length) {
          const previous = points[points.length - 1][0];
          while (lng - previous > 180) lng -= 360;
          while (lng - previous < -180) lng += 360;
        }
        // Web Mercator cannot display the poles.
        points.push([lng, Math.max(-85.051129, Math.min(85.051129, coordinate[1]))]);
      }
    }
    return points;
  }

  function routeBetween(visitor) {
    if (milesBetween(visitor, OLYMPIA) < 0.001) return [visitor.slice(), OLYMPIA.slice()];
    return unwrapRoute(turf.greatCircle(turf.point(visitor), turf.point(OLYMPIA), { npoints: 256 }));
  }

  function makePerson(map, position) {
    const element = document.createElement('div');
    element.className = 'marker person';
    element.setAttribute('role', 'img');
    element.setAttribute('aria-label', 'Shreya in Olympia, Washington');
    const glyph = document.createElement('span');
    glyph.className = 'person-glyph';
    glyph.textContent = '🧑‍💻';
    glyph.setAttribute('aria-hidden', 'true');
    element.append(glyph);
    new mapboxgl.Marker({ element, anchor: 'bottom' }).setLngLat(position).addTo(map);
    return glyph;
  }

  function makePin(map, position) {
    const element = document.createElement('div');
    element.className = 'marker pin';
    element.setAttribute('role', 'img');
    element.setAttribute('aria-label', 'Your approximate IP location');
    element.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="#4E988E" aria-hidden="true"><path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 0 0 .723 0l.028-.015.071-.041a16.98 16.98 0 0 0 1.144-.742 19.58 19.58 0 0 0 2.855-2.4C18.535 17.18 20.75 14.13 20.75 10a8.75 8.75 0 0 0-17.5 0c0 4.13 2.215 7.18 4.291 9.209a19.58 19.58 0 0 0 2.855 2.4c.367.252.688.453.917.59l.227.152ZM12 13.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" clip-rule="evenodd"/></svg>';
    // Heroicons' painted tip ends at y=22.5 of 24, about 2.5px above its box.
    new mapboxgl.Marker({ element, anchor: 'bottom', offset: [0, 2.5] }).setLngLat(position).addTo(map);
  }

  function showUnavailable(message) {
    statusEl.textContent = message;
    statusEl.hidden = false;
  }

  async function init() {
    if (!window.mapboxgl || !window.turf) {
      showUnavailable('The map couldn’t load. Please try again later.');
      return;
    }
    if (!MAPBOX_TOKEN.startsWith('pk.')) {
      showUnavailable('Add your Mapbox public token to index.html to display the map.');
      return;
    }
    if (!mapboxgl.supported()) {
      showUnavailable('This browser couldn’t display the map.');
      return;
    }
    const visitor = await getVisitorLocation();
    if (visitor) {
      const distance = milesBetween(OLYMPIA, visitor);
      captionEl.replaceChildren(document.createTextNode('I live in Olympia, Washington, roughly '));
      const span = document.createElement('span');
      span.id = 'distance';
      span.textContent = distance < 1 ? 'less than a mile' : Math.round(distance).toLocaleString('en-US') + ' miles';
      captionEl.append(span, document.createTextNode(' away from your location, according to your IP address.'));
    } else {
      captionEl.textContent = 'I live in Olympia, Washington. Your approximate location couldn’t be detected.';
    }

    mapboxgl.accessToken = MAPBOX_TOKEN;
    statusEl.textContent = 'Loading the map…';
    const map = new mapboxgl.Map({
      container: 'map', style: 'mapbox://styles/mapbox/light-v11',
      projection: 'mercator', center: visitor || OLYMPIA, zoom: visitor ? 10 : 9,
      minZoom: 0, maxZoom: 16, renderWorldCopies: true,
      // A portfolio illustration: prevent wheel/touch camera changes from
      // interrupting the opening sequence or trapping page scrolling.
      interactive: false, attributionControl: true
    });
    let loaded = false, ready = false, animating = false, routeBounds;
    let resizeFrame;
    const watchdog = setTimeout(() => {
      if (!loaded) showUnavailable('The map is taking too long to load. Please try again later.');
    }, 15000);
    map.on('error', event => {
      const code = event.error && event.error.status;
      if (code === 401 || code === 403) {
        showUnavailable('The map couldn’t load. Please check the Mapbox token and allowed URLs.');
      }
    });

    function fittedCamera() {
      const width = mapPanel.clientWidth, height = mapPanel.clientHeight;
      // 64px emoji + breathing room at top; attribution space at bottom.
      const side = Math.max(36, Math.min(64, width * 0.12));
      return map.cameraForBounds(routeBounds, {
        padding: { top: 82, bottom: 42, left: side, right: side }, maxZoom: 12
      });
    }

    function refit() {
      if (!ready || animating || !routeBounds) return;
      const camera = fittedCamera();
      if (camera) map.jumpTo({ center: camera.center, zoom: camera.zoom });
    }

    const observer = new ResizeObserver(() => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { map.resize(); refit(); });
    });
    observer.observe(mapPanel);
    map.on('remove', () => { observer.disconnect(); cancelAnimationFrame(resizeFrame); clearTimeout(watchdog); });

    map.once('load', () => {
      loaded = true;
      clearTimeout(watchdog);
      statusEl.hidden = true;
      try {
        // A restrained cream/sage/lavender palette, matching the portfolio.
        // Only adjust base-map fills; leave route and marker colors intact.
        for (const layer of map.getStyle().layers) {
          if (layer.type === 'background') {
            map.setPaintProperty(layer.id, 'background-color', '#f8f6f0');
          } else if (layer.type === 'fill' && layer.id === 'water') {
            map.setPaintProperty(layer.id, 'fill-color', '#e8e8f2');
          } else if (layer.type === 'fill' && /^(landuse|landcover|national-park)/.test(layer.id)) {
            map.setPaintProperty(layer.id, 'fill-color', '#e9eee5');
          }
        }
        if (!visitor) {
          makePerson(map, OLYMPIA).classList.add('visible');
          ready = true;
          return;
        }
        const points = routeBetween(visitor);
        const personPosition = points[points.length - 1];
        const person = makePerson(map, personPosition);
        makePin(map, points[0]);
        routeBounds = new mapboxgl.LngLatBounds();
        points.forEach(point => routeBounds.extend(point));
        map.addSource('distance-route', { type: 'geojson', data: {
          type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: points }
        }});
        map.addLayer({ id: 'distance-route', type: 'line', source: 'distance-route',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#9998CD', 'line-width': 3, 'line-dasharray': [2, 2],
            'line-opacity': 0, 'line-opacity-transition': { duration: reducedMotion.matches ? 0 : 700 }
          }
        });
        const finish = () => {
          animating = false;
          ready = true;
          person.classList.add('visible');
          refit();
          map.setPaintProperty('distance-route', 'line-opacity', 1);
        };
        const start = () => {
          const camera = fittedCamera();
          if (!camera) { finish(); return; }
          if (reducedMotion.matches) {
            map.jumpTo({ center: camera.center, zoom: camera.zoom });
            finish();
            return;
          }
          // Commit the invisible marker to a frame before its CSS fade starts.
          map.jumpTo({ center: points[0], zoom: Math.min(16, Math.max(10, camera.zoom + 2)) });
          requestAnimationFrame(() => requestAnimationFrame(() => {
            animating = true;
            person.classList.add('visible');
            map.once('moveend', finish);
            map.easeTo({ center: camera.center, zoom: camera.zoom, duration: 2500,
              easing: t => t * t * (3 - 2 * t) });
          }));
        };
        // Start when the iframe enters view, instead of finishing offscreen.
        const visibility = new IntersectionObserver(entries => {
          if (entries.some(entry => entry.isIntersecting)) { visibility.disconnect(); start(); }
        }, { threshold: 0.1 });
        visibility.observe(mapPanel);
        map.on('remove', () => visibility.disconnect());
      } catch {
        showUnavailable('The distance map couldn’t be displayed. Please try again later.');
      }
    });
  }
  init().catch(() => showUnavailable('The map couldn’t load. Please try again later.'));
  </script>
</body>
</html>
